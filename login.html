<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Login (CLERK) - Flowlet.ai</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script 
  async 
  data-clerk-publishable-key="pk_test_YWNlLXdhaG9vLTM2LmNsZXJrLmFjY291bnRzLmRldiQ" 
  src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js" 
  type="text/javascript">
</script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  font-family: 'Inter', sans-serif;
  background-color: #ffffff;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #111;
  -webkit-font-smoothing: antialiased;
}

#auth-container {
  width: 100%;
  max-width: 400px;
  padding: 20px;
  text-align: left !important; /* Force left alignment */
}

.custom-header {
  margin-bottom: 24px;
  text-align: left !important;
}

.custom-header h1 {
  font-size: 30px;
  font-weight: 700;
  margin-bottom: 12px;
  letter-spacing: -0.04em;
  line-height: 1.1;
  text-align: left !important;
}

.custom-header p {
  font-size: 15px;
  color: #666;
  line-height: 1.5;
  letter-spacing: -0.01em;
  text-align: left !important;
}

#clerk-signin-container {
  min-height: 200px; /* Space for the loader/component */
}

/* Custom styling for Clerk elements to match the screenshot */
.cl-rootBox {
  width: 100% !important;
  text-align: left !important;
}
.cl-card {
  box-shadow: none !important;
  border: none !important;
  padding: 0 !important;
  width: 100% !important;
  background: transparent !important;
  text-align: left !important;
}
.cl-header { display: none !important; }
.cl-footer { display: none !important; }

@media (max-width: 480px) {
  #auth-container {
    padding: 24px;
  }
}
</style>
</head>
<body>

<div id="auth-container">
  <div class="custom-header">
    <h1>Welcome back</h1>
    <p>Sign in to continue building your pipeline with AI-powered lead research.</p>
  </div>
  <div id="clerk-signin-container"></div>
</div>

<script>
  window.addEventListener('load', async function () {
    if (!window.Clerk) return;
    await Clerk.load();

    const signinContainer = document.getElementById('clerk-signin-container');
    
    if (Clerk.user) {
      window.location.href = 'dashboard.html';
    } else {
      try {
        Clerk.mountSignIn(signinContainer, {
          afterSignInUrl: 'dashboard.html',
          appearance: {
            layout: {
              socialButtonsVariant: 'iconButton',
              showOptionalFields: false,
            },
            variables: {
              colorPrimary: '#111',
              colorTextSecondary: '#666',
              borderRadius: '8px',
              fontFamily: 'Inter, sans-serif'
            },
            elements: {
              rootBox: { width: '100%' },
              card: { boxShadow: 'none', border: 'none', padding: '0', width: '100%' },
              header: { display: 'none' },
              socialButtonsBlockButton: {
                border: '1px solid #e5e7eb',
                boxShadow: 'none',
                height: '48px',
                fontSize: '15px',
                fontWeight: '500'
              },
              formFieldInput: {
                height: '48px',
                border: '1px solid #e5e7eb',
                fontSize: '15px'
              },
              formButtonPrimary: {
                height: '48px',
                fontSize: '15px',
                fontWeight: '600',
                backgroundColor: '#888',
                '&:hover': { backgroundColor: '#111' }
              },
              footer: { display: 'none' }
            }
          }
        });
      } catch (err) {
        console.error('Clerk Mount Error:', err);
      }
    }
  });
</script>
</body>
</html>
