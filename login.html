<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Login - Flowlet.ai</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script 
  async 
  data-clerk-publishable-key="pk_test_YWNlLXdhaG9vLTM2LmNsZXJrLmFjY291bnRzLmRldiQ" 
  src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js" 
  type="text/javascript">
</script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --tx:#111827;--mu:#6b7280;--mu2:#9ca3af;
  --b1:#e5e7eb;--b2:#d1d5db;
  --f:'Inter',sans-serif;
}
body{
  font-family:var(--f);
  color:var(--tx);
  height:100vh;
  display:flex;
  overflow:hidden;
  background:#fff;
}

/* ── LEFT PANEL ── */
.left-p{
  width:50%;
  background:#ffffff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:40px;
}
.logo-icon{
  position:absolute;
  top:32px;
  left:32px;
}

.frm-wrap{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* ── RIGHT PANEL ── */
.right-p{
  width:50%;
  background: radial-gradient(circle at 10% 10%, #fed7aa 0%, transparent 40%),
              radial-gradient(circle at 90% 10%, #ffedd5 0%, transparent 40%),
              radial-gradient(circle at 50% 90%, #fff7ed 0%, transparent 50%);
  background-color: #fafafa;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:60px 80px;
}
.r-inner{
  max-width:480px;
  margin:0 auto;
}
.r-title{
  font-size:36px;
  font-weight:500;
  line-height:1.2;
  letter-spacing:-0.03em;
  margin-bottom:32px;
  color:var(--tx);
}
.feat-sub{
  font-size:16px;
  font-weight:600;
  margin-bottom:16px;
  color:var(--tx);
}
.feat-list{
  list-style:none;
  display:flex;
  flex-direction:column;
  gap:16px;
  margin-bottom:80px;
}
.feat-item{
  display:flex;
  align-items:flex-start;
  gap:12px;
  font-size:15px;
  color:var(--mu);
  line-height:1.5;
}
.feat-item svg{
  flex-shrink:0;
  margin-top:2px;
  color:var(--tx);
}

@media (max-width: 900px) {
  body{flex-direction:column;overflow-y:auto}
  .left-p,.right-p{width:100%;min-height:100vh;}
}
</style>
</head>
<body>

<!-- LEFT PANEL -->
<div class="left-p">
  <div class="logo-icon">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="7" y1="6" x2="18" y2="6"/>
      <line x1="7" y1="6" x2="7" y2="19"/>
      <line x1="7" y1="12" x2="14" y2="12"/>
    </svg>
  </div>

  <div class="frm-wrap" id="clerk-signin-container">
    <!-- Clerk Sign In will be mounted here -->
  </div>
</div>

<!-- RIGHT PANEL -->
<div class="right-p">
  <div class="r-inner">
    <h2 class="r-title">Help your team move faster with advanced AI</h2>
    
    <div class="feat-sub">Top features</div>
    <ul class="feat-list">
      <li class="feat-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
        No training on your data; SAML security
      </li>
      <li class="feat-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
        Advanced access to our best model for work
      </li>
      <li class="feat-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        Integrate with Google Drive & other tools
      </li>
    </ul>
  </div>
</div>

<script>
  window.addEventListener('load', async function () {
    if (!window.Clerk) return;
    await Clerk.load();

    const signinContainer = document.getElementById('clerk-signin-container');
    
    if (Clerk.user) {
      // If already logged in, redirect to dashboard
      window.location.href = 'dashboard.html';
    } else {
      // Mount the Sign In component
      try {
        Clerk.mountSignIn(signinContainer, {
          afterSignInUrl: 'dashboard.html',
          appearance: {
            variables: {
              colorPrimary: '#ff7a59',
              fontFamily: 'Inter, sans-serif'
            },
            elements: {
              card: {
                boxShadow: 'none',
                border: 'none'
              }
            }
          }
        });
      } catch (err) {
        console.error('Clerk Mount Error:', err);
        alert('Clerk Setup Error: ' + err.message);
      }
    }
  });
</script>
</body>
</html>
